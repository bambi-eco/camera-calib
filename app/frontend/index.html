<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera Calibration Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1117;
  --bg-card: #161b22;
  --bg-elevated: #1c2129;
  --bg-hover: #21262d;
  --border: #30363d;
  --border-active: #58a6ff;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --text-dim: #6e7681;
  --accent: #58a6ff;
  --accent-hover: #79b8ff;
  --thermal: #ff6b35;
  --thermal-dim: #ff6b3544;
  --rgb-color: #58a6ff;
  --rgb-dim: #58a6ff44;
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 8px;
  --radius-lg: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
}

/* Layout */
.app { display: flex; height: 100vh; }

.sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-header .logo {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.5px;
  color: var(--accent);
}

.sidebar-header .logo-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}

.sidebar-section {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-section h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 8px;
  font-weight: 600;
}

.project-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.project-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s;
  font-size: 13px;
  margin-bottom: 2px;
}

.project-item:hover { background: var(--bg-hover); }
.project-item.active { background: var(--accent); color: #000; font-weight: 600; }
.project-item.active .project-pairs { color: #000a; }

.project-pairs {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

.project-item .edit-btn {
  opacity: 0;
  background: none;
  border: none;
  cursor: pointer;
  color: inherit;
  padding: 0 3px;
  font-size: 12px;
  line-height: 1;
  transition: opacity 0.15s;
}
.project-item:hover .edit-btn { opacity: 1; }
.project-item.active .edit-btn { color: #600; }

.project-item .delete-btn {
  opacity: 0;
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 4px;
  transition: opacity 0.15s;
}

.project-item:hover .delete-btn { opacity: 1; }
.project-item.active .delete-btn { color: #600; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn:hover { background: var(--bg-hover); border-color: var(--text-dim); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 600;
}

.btn-primary:hover { background: var(--accent-hover); }

.btn-success {
  background: var(--success);
  color: #000;
  border-color: var(--success);
  font-weight: 600;
}

.btn-danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
}

.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-block { width: 100%; justify-content: center; }

/* Main area */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  min-height: 48px;
  flex-wrap: wrap;
}

.toolbar .divider {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 4px;
}

.content {
  flex: 1;
  overflow: auto;
  position: relative;
}

/* Tab bar */
.tab-bar {
  display: flex;
  gap: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}

.tab {
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  font-family: var(--font-sans);
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.tab:hover { color: var(--text); background: var(--bg-hover); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
  color: var(--text-muted);
  text-align: center;
  padding: 40px;
}

.empty-state .icon {
  font-size: 48px;
  opacity: 0.3;
}

.empty-state h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
}

.empty-state p {
  font-size: 14px;
  max-width: 400px;
  line-height: 1.5;
}

/* Upload area */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin: 16px;
  background: var(--bg-elevated);
}

.upload-zone:hover,
.upload-zone.drag-over {
  border-color: var(--accent);
  background: #58a6ff0a;
}

.upload-zone h3 { font-size: 15px; margin-bottom: 6px; }
.upload-zone p { font-size: 13px; color: var(--text-muted); }

.upload-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px;
}

.upload-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
}

.upload-card h3 {
  font-size: 14px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.upload-card h3 .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}

.upload-card h3 .dot.rgb { background: var(--rgb-color); }
.upload-card h3 .dot.thermal { background: var(--thermal); }

.upload-card p {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.file-list {
  max-height: 120px;
  overflow-y: auto;
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.file-list div {
  padding: 2px 0;
  border-bottom: 1px solid var(--border);
}

/* Mode selector */
.mode-selector {
  display: flex;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
}

.mode-option {
  flex: 1;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-muted);
  background: none;
  border: none;
  font-family: var(--font-sans);
}

.mode-option:hover { color: var(--text); background: var(--bg-hover); }
.mode-option.active { background: var(--accent); color: #000; font-weight: 600; }

/* Annotation canvas area */
.anno-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  height: 100%;
  background: var(--border);
}

.anno-panel {
  background: var(--bg);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.anno-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  min-height: 32px;
}

.anno-panel-header .channel-label {
  display: flex;
  align-items: center;
  gap: 6px;
}

.anno-panel-header .channel-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.anno-panel-header .dims {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 400;
}

.canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: crosshair;
}

.canvas-wrap canvas {
  position: absolute;
  top: 0;
  left: 0;
}

.canvas-wrap.awaiting-click {
  outline: 3px solid var(--accent);
  outline-offset: -3px;
}

/* Point list */
.point-list {
  padding: 8px 16px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  max-height: 120px;
  overflow-y: auto;
}

.point-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
  font-size: 12px;
  font-family: var(--font-mono);
  border-bottom: 1px solid var(--border);
}

.point-row:last-child { border-bottom: none; }

.point-label {
  font-weight: 600;
  min-width: 24px;
  text-align: center;
  background: var(--bg-elevated);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
}

.point-coord {
  color: var(--text-muted);
  font-size: 11px;
}

.point-coord.rgb { color: var(--rgb-color); }
.point-coord.thermal { color: var(--thermal); }

.point-delete {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 13px;
  opacity: 0.5;
  padding: 0 4px;
}

.point-delete:hover { opacity: 1; }

/* Pair navigator */
.pair-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pair-nav .pair-label {
  font-size: 13px;
  font-family: var(--font-mono);
  font-weight: 600;
  min-width: 80px;
  text-align: center;
}

/* Results */
.results-grid {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.result-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
}

.result-card h3 {
  font-size: 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.result-metric {
  display: inline-flex;
  flex-direction: column;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 20px;
  margin-right: 12px;
  margin-bottom: 8px;
}

.result-metric .value {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
}

.result-metric .label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.calib-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 8px;
}

.calib-table th {
  text-align: left;
  padding: 6px 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  font-weight: 600;
}

.calib-table td {
  padding: 6px 12px;
  border: 1px solid var(--border);
  color: var(--text);
}

.overlay-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.overlay-gallery img {
  width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

/* Calibration input form */
.calib-form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px;
}

.calib-form-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
}

.calib-form-section h3 {
  font-size: 13px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-row {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 6px;
}

.form-row label {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.form-row input {
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 12px;
}

.form-row input:focus {
  outline: none;
  border-color: var(--accent);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 20px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 999;
  animation: slideIn 0.3s ease;
  max-width: 400px;
}

.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }

@keyframes slideIn {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* Single-camera image grid */
.sc-image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}

.sc-image-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.sc-image-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  display: block;
}

.sc-image-card.sc-found  { border-color: var(--success); }
.sc-image-card.sc-not-found { border-color: var(--danger); }

.sc-image-name {
  padding: 4px 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Initial calib upload card */
.calib-upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
  color: var(--text-muted);
}

.calib-upload-zone:hover {
  border-color: var(--accent);
  background: #58a6ff08;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}

.status-badge.ok { background: #3fb95022; color: var(--success); }
.status-badge.warn { background: #d2992222; color: var(--warning); }
.status-badge.err { background: #f8514922; color: var(--danger); }

/* Heatmap panel */
.heatmap-overlay {
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: 0;
  animation: heatmapSlideIn 0.25s ease;
}

@keyframes heatmapSlideIn {
  from { max-height: 0; opacity: 0; }
  to   { max-height: 600px; opacity: 1; }
}

.heatmap-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.heatmap-toolbar label {
  font-size: 12px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.heatmap-toolbar input[type="range"] {
  width: 80px;
  accent-color: var(--accent);
}

.heatmap-toolbar .range-val {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  min-width: 20px;
  color: var(--accent);
}

.heatmap-grid-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
  background: var(--border);
}

.heatmap-cell {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
}

.heatmap-cell h4 {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.heatmap-canvas-wrap {
  position: relative;
  width: 100%;
  max-width: 480px;
  aspect-ratio: 4 / 3;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.heatmap-canvas-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.heatmap-gradient {
  width: 100px;
  height: 10px;
  border-radius: 3px;
  border: 1px solid var(--border);
}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const API = '';

// ─── Utility ───
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, opts);
  if (!res.ok) {
    const text = await res.text();
    throw new Error(text || res.statusText);
  }
  return res.json();
}

// ─── App ───
function App() {
  const [projects, setProjects] = useState([]);
  const [activeProject, setActiveProject] = useState(null);
  const [tab, setTab] = useState('upload'); // upload | annotate | calibrate | results
  const [mode, setMode] = useState('stereo'); // 'stereo' | 'single'
  const [singleProjects, setSingleProjects] = useState([]);
  const [activeSingleProject, setActiveSingleProject] = useState(null);

  const loadProjects = useCallback(async () => {
    try {
      const data = await api('/api/projects');
      setProjects(data);
    } catch (e) { console.error(e); }
  }, []);

  useEffect(() => { loadProjects(); }, [loadProjects]);

  const createProject = async () => {
    const name = prompt('Project name:', `Calibration ${projects.length + 1}`);
    if (!name) return;
    const fd = new FormData();
    fd.append('name', name);
    const proj = await api('/api/projects', { method: 'POST', body: fd });
    await loadProjects();
    setActiveProject(proj);
    setTab('upload');
  };

  const deleteProject = async (e, pid) => {
    e.stopPropagation();
    if (!confirm('Delete this project?')) return;
    await api(`/api/projects/${pid}`, { method: 'DELETE' });
    if (activeProject?.id === pid) setActiveProject(null);
    await loadProjects();
  };

  const renameProject = async (e, pid, newName) => {
    e.stopPropagation();
    if (!newName.trim()) return;
    const updated = await api(`/api/projects/${pid}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: newName.trim() }),
    });
    setProjects(ps => ps.map(p => p.id === pid ? { ...p, name: updated.name } : p));
    if (activeProject?.id === pid) setActiveProject(a => ({ ...a, name: updated.name }));
  };

  const selectProject = async (proj) => {
    const full = await api(`/api/projects/${proj.id}`);
    setActiveProject(full);
  };

  const refreshProject = async () => {
    if (!activeProject) return;
    const full = await api(`/api/projects/${activeProject.id}`);
    setActiveProject(full);
  };

  const loadSingleProjects = useCallback(async () => {
    try {
      const data = await api('/api/single-calib/projects');
      setSingleProjects(data);
    } catch (e) { console.error(e); }
  }, []);

  useEffect(() => { if (mode === 'single') loadSingleProjects(); }, [mode, loadSingleProjects]);

  const createSingleProject = async () => {
    const name = prompt('Project name:', `Single Calib ${singleProjects.length + 1}`);
    if (!name) return;
    const fd = new FormData();
    fd.append('name', name);
    const proj = await api('/api/single-calib/projects', { method: 'POST', body: fd });
    await loadSingleProjects();
    setActiveSingleProject(proj);
  };

  const deleteSingleProject = async (e, pid) => {
    e.stopPropagation();
    if (!confirm('Delete this project?')) return;
    await api(`/api/single-calib/projects/${pid}`, { method: 'DELETE' });
    if (activeSingleProject?.id === pid) setActiveSingleProject(null);
    await loadSingleProjects();
  };

  const renameSingleProject = async (e, pid, newName) => {
    e.stopPropagation();
    if (!newName.trim()) return;
    const updated = await api(`/api/single-calib/projects/${pid}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: newName.trim() }),
    });
    setSingleProjects(ps => ps.map(p => p.id === pid ? { ...p, name: updated.name } : p));
    if (activeSingleProject?.id === pid) setActiveSingleProject(a => ({ ...a, name: updated.name }));
  };

  const selectSingleProject = async (proj) => {
    const full = await api(`/api/single-calib/projects/${proj.id}`);
    setActiveSingleProject(full);
  };

  const refreshSingleProject = async () => {
    if (!activeSingleProject) return;
    const full = await api(`/api/single-calib/projects/${activeSingleProject.id}`);
    setActiveSingleProject(full);
  };

  return (
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-header">
          <div>
            <div className="logo">CAM·CALIB</div>
            <div className="logo-sub">{mode === 'stereo' ? 'Thermal / RGB Alignment' : 'Single Camera'}</div>
          </div>
        </div>

        <div className="sidebar-section" style={{ display: 'flex', gap: 4 }}>
          <button className={`btn btn-sm ${mode === 'stereo' ? 'btn-primary' : ''}`} style={{ flex: 1 }} onClick={() => setMode('stereo')}>Stereo</button>
          <button className={`btn btn-sm ${mode === 'single' ? 'btn-primary' : ''}`} style={{ flex: 1 }} onClick={() => setMode('single')}>Single Cam</button>
        </div>

        <div className="sidebar-section">
          <button className="btn btn-primary btn-block" onClick={mode === 'stereo' ? createProject : createSingleProject}>
            + New Project
          </button>
        </div>

        <div className="project-list">
          <div className="sidebar-section" style={{ border: 'none', padding: '4px 0' }}>
            <h3>Projects</h3>
          </div>
          {mode === 'stereo' ? (
            <>
              {projects.map(p => (
                <ProjectItem
                  key={p.id}
                  project={p}
                  isActive={activeProject?.id === p.id}
                  badge={`${(p.pairs || []).length}pr`}
                  onSelect={() => selectProject(p)}
                  onRename={(e, name) => renameProject(e, p.id, name)}
                  onDelete={(e) => deleteProject(e, p.id)}
                />
              ))}
              {projects.length === 0 && (
                <div style={{ padding: '12px', fontSize: 12, color: 'var(--text-dim)', textAlign: 'center' }}>
                  No projects yet
                </div>
              )}
            </>
          ) : (
            <>
              {singleProjects.map(p => (
                <ProjectItem
                  key={p.id}
                  project={p}
                  isActive={activeSingleProject?.id === p.id}
                  badge={`${(p.images || []).length}img`}
                  onSelect={() => selectSingleProject(p)}
                  onRename={(e, name) => renameSingleProject(e, p.id, name)}
                  onDelete={(e) => deleteSingleProject(e, p.id)}
                />
              ))}
              {singleProjects.length === 0 && (
                <div style={{ padding: '12px', fontSize: 12, color: 'var(--text-dim)', textAlign: 'center' }}>
                  No projects yet
                </div>
              )}
            </>
          )}
        </div>
      </div>

      <div className="main">
        {mode === 'stereo' ? (
          activeProject ? (
            <>
              <div className="tab-bar">
                <button className={`tab ${tab === 'upload' ? 'active' : ''}`} onClick={() => setTab('upload')}>
                  ① Upload
                </button>
                <button className={`tab ${tab === 'calibration-input' ? 'active' : ''}`} onClick={() => setTab('calibration-input')}>
                  ② Initial Calib <span style={{ fontSize: 10, opacity: 0.6, fontWeight: 400 }}>(optional)</span>
                </button>
                <button className={`tab ${tab === 'annotate' ? 'active' : ''}`} onClick={() => setTab('annotate')}>
                  ③ Annotate
                </button>
                <button className={`tab ${tab === 'results' ? 'active' : ''}`} onClick={() => setTab('results')}>
                  ④ Results
                </button>
              </div>
              {tab === 'upload' && (
                <UploadTab project={activeProject} onRefresh={refreshProject} />
              )}
              {tab === 'calibration-input' && (
                <CalibrationInputTab project={activeProject} onRefresh={refreshProject} />
              )}
              {tab === 'annotate' && (
                <AnnotateTab project={activeProject} onRefresh={refreshProject} />
              )}
              {tab === 'results' && (
                <ResultsTab project={activeProject} onRefresh={refreshProject} />
              )}
            </>
          ) : (
            <div className="empty-state">
              <div className="icon">⊞</div>
              <h2>Select or create a project</h2>
              <p>Create a new calibration project to start uploading RGB and thermal image/video pairs for keypoint annotation and camera calibration.</p>
            </div>
          )
        ) : (
          activeSingleProject ? (
            <SingleCamProjectView project={activeSingleProject} onRefresh={refreshSingleProject} />
          ) : (
            <div className="empty-state">
              <div className="icon">◎</div>
              <h2>Select or create a project</h2>
              <p>Upload checkerboard images from a single camera to compute its intrinsics and distortion coefficients automatically.</p>
            </div>
          )
        )}
      </div>
    </div>
  );
}

// ─── Upload Tab ───
function UploadTab({ project, onRefresh }) {
  const [mode, setMode] = useState('images'); // images | videos
  const [uploading, setUploading] = useState(false);
  const [rgbFiles, setRgbFiles] = useState([]);
  const [thermalFiles, setThermalFiles] = useState([]);

  const pairs = project.pairs || [];

  const uploadImages = async (channel, files) => {
    if (!files.length) return;
    setUploading(true);
    try {
      const fd = new FormData();
      fd.append('channel', channel);
      for (const f of files) fd.append('files', f);
      await api(`/api/projects/${project.id}/upload-images`, { method: 'POST', body: fd });
      toast(`Uploaded ${files.length} ${channel} images`, 'success');
      await onRefresh();
    } catch (e) {
      toast(`Upload failed: ${e.message}`, 'error');
    }
    setUploading(false);
  };

  const uploadVideo = async (channel, file) => {
    if (!file) return;
    setUploading(true);
    try {
      const fd = new FormData();
      fd.append('channel', channel);
      fd.append('file', file);
      const res = await api(`/api/projects/${project.id}/upload-video`, { method: 'POST', body: fd });
      toast(`Extracted frame from ${channel} video: ${res.extracted_frame}`, 'success');
      await onRefresh();
    } catch (e) {
      toast(`Video upload failed: ${e.message}`, 'error');
    }
    setUploading(false);
  };

  const deletePair = async (pairId) => {
    try {
      await api(`/api/projects/${project.id}/pairs/${pairId}`, { method: 'DELETE' });
      toast('Pair deleted', 'success');
      await onRefresh();
    } catch (e) {
      toast(`Delete failed: ${e.message}`, 'error');
    }
  };

  const uploadVideoPair = async (rgbFile, thermalFile) => {
    if (!rgbFile || !thermalFile) {
      toast('Please select both RGB and thermal videos', 'error');
      return;
    }
    setUploading(true);
    try {
      const fd = new FormData();
      fd.append('rgb_file', rgbFile);
      fd.append('thermal_file', thermalFile);
      const res = await api(`/api/projects/${project.id}/upload-video-pair`, { method: 'POST', body: fd });
      toast(`Extracted frames: RGB=${res.rgb}, Thermal=${res.thermal}`, 'success');
      setRgbFiles([]);
      setThermalFiles([]);
      await onRefresh();
    } catch (e) {
      toast(`Video pair upload failed: ${e.message}`, 'error');
    }
    setUploading(false);
  };

  return (
    <div className="content" style={{ overflow: 'auto' }}>
      <div style={{ padding: 16 }}>
        <div className="mode-selector">
          <button className={`mode-option ${mode === 'images' ? 'active' : ''}`} onClick={() => setMode('images')}>
            📷 Image Pairs
          </button>
          <button className={`mode-option ${mode === 'videos' ? 'active' : ''}`} onClick={() => setMode('videos')}>
            🎬 Video Pairs (extract frame)
          </button>
        </div>
      </div>

      {mode === 'images' ? (
        <div className="upload-grid">
          <UploadCard
            channel="rgb"
            label="RGB Images"
            dotClass="rgb"
            accept="image/*"
            multiple
            onFiles={(files) => uploadImages('rgb', files)}
            disabled={uploading}
            description="Upload RGB camera images (.jpg, .png)"
          />
          <UploadCard
            channel="thermal"
            label="Thermal Images"
            dotClass="thermal"
            accept="image/*"
            multiple
            onFiles={(files) => uploadImages('thermal', files)}
            disabled={uploading}
            description="Upload thermal camera images (.jpg, .png)"
          />
        </div>
      ) : (
        <div className="upload-grid">
          <UploadCard
            channel="rgb"
            label="RGB Video"
            dotClass="rgb"
            accept="video/*"
            onFiles={(files) => { setRgbFiles(Array.from(files)); }}
            disabled={uploading}
            description="Select RGB video file — central frame will be extracted"
            selectedFiles={rgbFiles}
          />
          <UploadCard
            channel="thermal"
            label="Thermal Video"
            dotClass="thermal"
            accept="video/*"
            onFiles={(files) => { setThermalFiles(Array.from(files)); }}
            disabled={uploading}
            description="Select thermal video file — central frame will be extracted"
            selectedFiles={thermalFiles}
          />
          <div style={{ gridColumn: '1 / -1', padding: '0 0 16px' }}>
            <button
              className="btn btn-primary btn-block"
              disabled={uploading || rgbFiles.length === 0 || thermalFiles.length === 0}
              onClick={() => uploadVideoPair(rgbFiles[0], thermalFiles[0])}
            >
              {uploading ? <><span className="spinner" /> Extracting frames...</> : 'Extract & Upload Pair'}
            </button>
          </div>
        </div>
      )}

      {pairs.length > 0 && (
        <div style={{ padding: 16 }}>
          <h3 style={{ fontSize: 14, marginBottom: 8 }}>Paired Images ({pairs.length})</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 12 }}>
            {pairs.map(p => (
              <div key={p.id} style={{
                display: 'flex', gap: 8, background: 'var(--bg-card)', border: '1px solid var(--border)',
                borderRadius: 'var(--radius)', padding: 8, alignItems: 'center', position: 'relative'
              }}>
                <img
                  src={`/api/projects/${project.id}/image/rgb/${p.rgb}`}
                  style={{ width: 80, height: 60, objectFit: 'cover', borderRadius: 4 }}

                  <div style={{ color: 'var(--thermal)' }}>TH: {p.thermal}</div>

                    background: 'var(--danger)', color: '#fff', border: 'none',
                    borderRadius: '50%', width: 20, height: 20, cursor: 'pointer',
