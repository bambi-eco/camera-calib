              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function UploadCard({ channel, label, dotClass, accept, multiple, onFiles, disabled, description, selectedFiles }) {
  const inputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    if (e.dataTransfer.files.length > 0) {
      onFiles(Array.from(e.dataTransfer.files));
    }
  };

  return (
    <div className="upload-card">
      <h3><span className={`dot ${dotClass}`} /> {label}</h3>
      <p>{description}</p>

      <div
        className={`upload-zone ${dragOver ? 'drag-over' : ''}`}
        style={{ margin: 0, padding: 20 }}
        onClick={() => inputRef.current?.click()}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={() => setDragOver(false)}
        onDrop={handleDrop}
      >
        <p>Click or drag files here</p>
        <input
          ref={inputRef}
          type="file"
          accept={accept}
          multiple={multiple}
          style={{ display: 'none' }}
          onChange={(e) => {
            if (e.target.files.length) onFiles(Array.from(e.target.files));
            e.target.value = '';
          }}
        />
      </div>

      {selectedFiles && selectedFiles.length > 0 && (
        <div className="file-list">
          {selectedFiles.map((f, i) => <div key={i}>✓ {f.name}</div>)}
        </div>
      )}
    </div>
  );
}

// ─── Calibration Input Tab ───
function CalibrationInputTab({ project, onRefresh }) {
  const [calib, setCalib] = useState(null);
  const fileRef = useRef(null);

  useEffect(() => {
    if (project.initial_calibration) {
      setCalib(project.initial_calibration);
    }
  }, [project]);

  const handleUploadJSON = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      await api(`/api/projects/${project.id}/initial-calibration`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      setCalib(data);
      toast('Initial calibration loaded', 'success');
      await onRefresh();
    } catch (e) {
      toast(`Failed to load calibration: ${e.message}`, 'error');
    }
  };

  const removeCalib = async () => {
    try {
      await api(`/api/projects/${project.id}/initial-calibration`, { method: 'DELETE' });
      setCalib(null);
      if (fileRef.current) fileRef.current.value = '';
      toast('Initial calibration removed', 'success');
      await onRefresh();
    } catch (e) {
      toast(`Failed to remove calibration: ${e.message}`, 'error');
    }
  };

  const saveCalib = async () => {
    try {
      await api(`/api/projects/${project.id}/initial-calibration`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(calib),
      });
      toast('Calibration saved', 'success');
      await onRefresh();
    } catch (e) {
      toast(`Save failed: ${e.message}`, 'error');
    }
  };

  const updateValue = (camera, field, value) => {
    setCalib(prev => {
      const c = JSON.parse(JSON.stringify(prev));
      const cam = camera === 'rgb' ? (c.RGB || c.Wide || c.wide) : (c.Thermal || c.thermal);
      if (!cam) return prev;
      const K = cam.K || cam.mtx;
      const dist = cam.dist;

      if (field === 'fx') K[0][0] = parseFloat(value) || 0;
      else if (field === 'fy') K[1][1] = parseFloat(value) || 0;
      else if (field === 'cx') K[0][2] = parseFloat(value) || 0;
      else if (field === 'cy') K[1][2] = parseFloat(value) || 0;
      else if (field.startsWith('d')) {
        const idx = parseInt(field[1]);
        const d = Array.isArray(dist[0]) ? dist[0] : dist;
        d[idx] = parseFloat(value) || 0;
      }
      return c;
    });
  };

  const getValues = (camera) => {
    if (!calib) return null;
    const cam = camera === 'rgb'
      ? (calib.RGB || calib.Wide || calib.wide)
      : (calib.Thermal || calib.thermal);
    if (!cam) return null;
    const K = cam.K || cam.mtx;
    const dist = Array.isArray((cam.dist || [])[0]) ? cam.dist[0] : (cam.dist || []);
    return {
      fx: K[0][0], fy: K[1][1], cx: K[0][2], cy: K[1][2],
      d0: dist[0] || 0, d1: dist[1] || 0, d2: dist[2] || 0, d3: dist[3] || 0, d4: dist[4] || 0,
    };
  };

  return (
    <div className="content" style={{ overflow: 'auto' }}>
      <div style={{ padding: 16 }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
          <div
            className="calib-upload-zone"
            style={{ flex: 1 }}
            onClick={() => fileRef.current?.click()}
          >
            📂 Load calibration JSON file
            <input ref={fileRef} type="file" accept=".json" style={{ display: 'none' }} onChange={handleUploadJSON} />
          </div>
          {calib && (
            <>
              <button className="btn btn-success" onClick={saveCalib}>
                💾 Save Changes
              </button>
              <button className="btn" onClick={removeCalib} style={{ borderColor: 'var(--danger)', color: 'var(--danger)' }} title="Remove initial calibration">
                ✕ Remove
              </button>
            </>
          )}
        </div>

        {!calib && (
          <div style={{ color: 'var(--text-muted)', fontSize: 13, padding: 20, textAlign: 'center' }}>
            <strong style={{ color: 'var(--text)' }}>Optional.</strong> Upload an initial_calibration.json with Thermal and RGB/Wide camera matrices and distortion coefficients for best results. If skipped, intrinsics will be auto-estimated from image dimensions.
          </div>
        )}
      </div>

      {calib && (
        <div className="calib-form">
          {[['rgb', 'RGB / Wide Camera', 'rgb'], ['thermal', 'Thermal Camera', 'thermal']].map(([key, label, dot]) => {
            const vals = getValues(key);
            if (!vals) return null;
            return (
              <div key={key} className="calib-form-section">
                <h3><span className={`dot ${dot}`} style={{ width: 10, height: 10, borderRadius: '50%', background: dot === 'rgb' ? 'var(--rgb-color)' : 'var(--thermal)', display: 'inline-block' }} /> {label}</h3>
                <div style={{ fontSize: 11, color: 'var(--text-dim)', marginBottom: 12, fontFamily: 'var(--font-mono)' }}>
                  Intrinsic Matrix (K)
                </div>
                {['fx', 'fy', 'cx', 'cy'].map(f => (
                  <div className="form-row" key={f}>
                    <label>{f}</label>
                    <input type="number" step="any" value={vals[f]} onChange={e => updateValue(key, f, e.target.value)} />
                  </div>
                ))}
                <div style={{ fontSize: 11, color: 'var(--text-dim)', margin: '12px 0 8px', fontFamily: 'var(--font-mono)' }}>
                  Distortion (k1, k2, p1, p2, k3)
                </div>
                {['d0', 'd1', 'd2', 'd3', 'd4'].map((f, i) => (
                  <div className="form-row" key={f}>
                    <label>{['k1', 'k2', 'p1', 'p2', 'k3'][i]}</label>
                    <input type="number" step="any" value={vals[f]} onChange={e => updateValue(key, f, e.target.value)} />
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── Annotate Tab ───
function AnnotateTab({ project, onRefresh }) {
  const pairs = project.pairs || [];
  const [pairIdx, setPairIdx] = useState(0);
  const [annotations, setAnnotations] = useState(project.annotations || {});
  const xmlImportRef = useRef(null);
  const [saveStatus, setSaveStatus] = useState('saved'); // 'saved' | 'saving' | 'unsaved'
  const autoSaveTimer = useRef(null);
  const skipNextSave = useRef(true); // skip initial mount + project switches
  const [showHeatmap, setShowHeatmap] = useState(false);
  const [heatmapRows, setHeatmapRows] = useState(8);
  const [heatmapCols, setHeatmapCols] = useState(8);
  const [tool, setTool] = useState('place'); // 'place' | 'grab'
  const grabUndoPushed = useRef(false);

  // Undo stack — stores previous annotation snapshots (max 50)
  const undoStackRef = useRef([]);
  const [undoCount, setUndoCount] = useState(0);

  // Sync annotations and reset pair index when the project changes
  useEffect(() => {
    skipNextSave.current = true;
    setAnnotations(project.annotations || {});
    setPairIdx(0);
    undoStackRef.current = [];
    setUndoCount(0);
    setSaveStatus('saved');
  }, [project.id]);

  // Auto-save 800 ms after any annotation change
  useEffect(() => {
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    setSaveStatus('unsaved');
    clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current = setTimeout(async () => {
      setSaveStatus('saving');
      try {
        await api(`/api/projects/${project.id}/annotations`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ annotations }),
        });
        setSaveStatus('saved');
      } catch (e) {
        setSaveStatus('unsaved');
        toast(`Auto-save failed: ${e.message}`, 'error');
      }
    }, 800);
    return () => clearTimeout(autoSaveTimer.current);
  }, [annotations]);

  const MAX_UNDO = 50;

  const pushUndo = useCallback((prevAnnotations) => {
    undoStackRef.current.push(JSON.stringify(prevAnnotations));
    if (undoStackRef.current.length > MAX_UNDO) {
      undoStackRef.current.shift();
    }
    setUndoCount(undoStackRef.current.length);
  }, []);

  const undo = useCallback(() => {
    if (undoStackRef.current.length === 0) return;
    const prev = JSON.parse(undoStackRef.current.pop());
    setAnnotations(prev);
    setUndoCount(undoStackRef.current.length);
    toast('Undo', 'info');
  }, []);

  // Ctrl+Z keyboard shortcut
  useEffect(() => {
    const handler = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        undo();
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [undo]);

  const pair = pairs[pairIdx] || null;
  const pairId = pair ? String(pair.id) : null;
  const currentPoints = pairId && annotations[pairId] ? annotations[pairId].points || [] : [];

  // Determine what click is expected next.
  // null means no half-point is pending — both panels accept a new point.
  const pendingChannel = useMemo(() => {
    if (currentPoints.length === 0) return null;
    const last = currentPoints[currentPoints.length - 1];
    if (last.rgb && !last.thermal) return 'thermal';
    if (last.thermal && !last.rgb) return 'rgb';
    return null; // last point is complete — either channel starts the next one
  }, [currentPoints]);

  const handleCanvasClick = useCallback((channel, x, y) => {
    if (!pairId) return;
    setAnnotations(prev => {
      pushUndo(prev);
      const copy = JSON.parse(JSON.stringify(prev));
      if (!copy[pairId]) copy[pairId] = { points: [] };
      const pts = copy[pairId].points;
      const rounded = [Math.round(x), Math.round(y)];

      if (channel === 'rgb') {
        const pending = pts.findLast(p => p.thermal && !p.rgb);
        if (pending) {
          pending.rgb = rounded; // complete a thermal-first half-point
        } else {
          pts.push({ label: String(pts.length), rgb: rounded, thermal: null });
        }
      } else {
        const pending = pts.findLast(p => p.rgb && !p.thermal);
        if (pending) {
          pending.thermal = rounded; // complete an rgb-first half-point
        } else {
          pts.push({ label: String(pts.length), rgb: null, thermal: rounded });
        }
      }
      return copy;
    });
  }, [pairId, pushUndo]);

  const deletePoint = (idx) => {
    setAnnotations(prev => {
      pushUndo(prev);
      const copy = JSON.parse(JSON.stringify(prev));
      if (!copy[pairId]) return prev;
      copy[pairId].points.splice(idx, 1);
      // Re-label
      copy[pairId].points.forEach((p, i) => p.label = String(i));
      return copy;
    });
  };

  const handleMovePoint = useCallback((channel, idx, x, y) => {
    if (!pairId) return;
    setAnnotations(prev => {
      if (!grabUndoPushed.current) {
        pushUndo(prev);
        grabUndoPushed.current = true;
      }
      const copy = JSON.parse(JSON.stringify(prev));
      if (!copy[pairId]?.points?.[idx]) return prev;
      copy[pairId].points[idx][channel] = [Math.round(x), Math.round(y)];
      return copy;
    });
  }, [pairId, pushUndo]);

  const handleDragEnd = useCallback(() => {
    grabUndoPushed.current = false;
  }, []);

  const importXml = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    e.target.value = '';
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch(`/api/projects/${project.id}/upload-annotations`, { method: 'POST', body: fd });
      if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Upload failed'); }
      const data = await res.json();
      skipNextSave.current = true; // backend already saved via upload endpoint
      setAnnotations(data.annotations);
      setSaveStatus('saved');
      toast(`Imported annotations for ${data.imported} pair(s)`, 'success');
      await onRefresh();
    } catch (e) {
      toast(`Import failed: ${e.message}`, 'error');
    }
  };


  const totalPoints = Object.values(annotations).reduce(
    (sum, a) => sum + (a.points || []).filter(p => p.rgb && p.thermal).length, 0
  );

  if (pairs.length === 0) {
    return (
      <div className="empty-state">
        <div className="icon">📷</div>
        <h2>No image pairs</h2>
        <p>Upload RGB and thermal images first in the Upload tab.</p>
      </div>
    );
  }

  return (
    <div className="main" style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <div className="toolbar">
        <div className="pair-nav">
          <button className="btn btn-sm" disabled={pairIdx <= 0} onClick={() => setPairIdx(i => i - 1)}>◀</button>
          <span className="pair-label">Pair {pairIdx + 1}/{pairs.length}</span>
          <button className="btn btn-sm" disabled={pairIdx >= pairs.length - 1} onClick={() => setPairIdx(i => i + 1)}>▶</button>
        </div>
        <div className="divider" />
        <button
          className={`btn btn-sm ${tool === 'place' ? 'btn-primary' : ''}`}
          onClick={() => setTool('place')}
          title="Place new annotation points"
        >+ Place</button>
        <button
          className={`btn btn-sm ${tool === 'grab' ? 'btn-primary' : ''}`}
          onClick={() => setTool('grab')}
          title="Drag existing annotation points"
          style={{ marginLeft: 4 }}
        >&#10021; Grab</button>
        <div className="divider" />
        {tool === 'place' && (
          <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>
            {pendingChannel === null ? (
              <>Click <strong style={{ color: 'var(--rgb-color)' }}>RGB</strong> or <strong style={{ color: 'var(--thermal)' }}>Thermal</strong> to start point #{currentPoints.filter(p => p.rgb && p.thermal).length + 1}</>
            ) : (
              <>Click <strong style={{ color: pendingChannel === 'rgb' ? 'var(--rgb-color)' : 'var(--thermal)' }}>{pendingChannel === 'rgb' ? 'RGB' : 'Thermal'}</strong> to complete point #{currentPoints.length}</>
            )}
          </span>
        )}
        <div className="divider" />
        <span className="status-badge ok">{totalPoints} total points</span>
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          <button
            className="btn btn-sm"
            onClick={undo}
            disabled={undoCount === 0}
            title="Undo last action (Ctrl+Z)"
          >
            ↩ Undo
          </button>
          <div className="divider" />
          <button
            className={`btn btn-sm ${showHeatmap ? 'btn-primary' : ''}`}
            onClick={() => setShowHeatmap(h => !h)}
            title="Toggle point-distribution heatmap"
          >
            🗺 Heatmap
          </button>
          <span style={{ fontSize: 12, color: saveStatus === 'saved' ? 'var(--success)' : saveStatus === 'saving' ? 'var(--text-muted)' : 'var(--warning)' }}>
            {saveStatus === 'saving' ? <><span className="spinner" /> Saving…</> : saveStatus === 'saved' ? '✓ Saved' : '● Unsaved'}
          </span>
          <a className="btn btn-sm" href={`/api/projects/${project.id}/download-annotations`} target="_blank">
            ↓ XML
          </a>
          <input ref={xmlImportRef} type="file" accept=".xml" style={{ display: 'none' }} onChange={importXml} />
          <button className="btn btn-sm" onClick={() => xmlImportRef.current?.click()} title="Import annotations from pairs.xml">
            ↑ XML
          </button>
        </div>
      </div>

      <div className="anno-container" style={{ flex: 1 }}>
        {pair && ['rgb', 'thermal'].map(channel => (
          <AnnotationPanel
            key={`${pair.id}-${channel}`}
            projectId={project.id}
            pair={pair}
            channel={channel}
            points={currentPoints}
            isActive={tool === 'place' && (pendingChannel === null || pendingChannel === channel)}
            tool={tool}
            onClick={(x, y) => {
              if (tool === 'place' && (pendingChannel === null || pendingChannel === channel)) handleCanvasClick(channel, x, y);
            }}
            onMovePoint={(idx, x, y) => handleMovePoint(channel, idx, x, y)}
            onDragEnd={handleDragEnd}
          />
        ))}
      </div>

      {showHeatmap && (
        <HeatmapPanel
          projectId={project.id}
          annotations={annotations}
          rows={heatmapRows}
          cols={heatmapCols}
          onRowsChange={setHeatmapRows}
          onColsChange={setHeatmapCols}
        />
      )}

      {currentPoints.length > 0 && (
        <div className="point-list">
          {currentPoints.map((pt, idx) => (
            <div className="point-row" key={idx}>
              <span className="point-label">{pt.label}</span>
              <span className="point-coord rgb">
                RGB: {pt.rgb ? `(${pt.rgb[0]}, ${pt.rgb[1]})` : '—'}
              </span>
              <span className="point-coord thermal">
                TH: {pt.thermal ? `(${pt.thermal[0]}, ${pt.thermal[1]})` : '—'}
              </span>
              <button className="point-delete" onClick={() => deletePoint(idx)}>✕</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Heatmap Panel ───
function HeatmapPanel({ projectId, annotations, rows, cols, onRowsChange, onColsChange }) {
  const [heatData, setHeatData] = useState(null);
  const [loading, setLoading] = useState(false);
  const rgbCanvasRef = useRef(null);
  const thermalCanvasRef = useRef(null);

  // Fetch heatmap whenever annotations, rows, or cols change
  useEffect(() => {
    let cancelled = false;
    const fetchHeatmap = async () => {
      setLoading(true);
      try {
        const data = await api(`/api/projects/${projectId}/point-heatmap?rows=${rows}&cols=${cols}`);
        if (!cancelled) setHeatData(data);
      } catch (e) {
        console.error('Heatmap fetch failed:', e);
      }
      if (!cancelled) setLoading(false);
    };
    fetchHeatmap();
    return () => { cancelled = true; };
  }, [projectId, annotations, rows, cols]);

  // Draw heatmap on canvas
  const drawHeatmap = useCallback((canvasEl, channel) => {
    if (!canvasEl || !heatData) return;
    const channelData = heatData[channel];
    if (!channelData) return;
    const { grid, max: maxVal } = channelData;
    const normPoints = heatData[`points_${channel}`] || [];
    const R = heatData.rows;
    const C = heatData.cols;

    const rect = canvasEl.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvasEl.width = rect.width * dpr;
    canvasEl.height = rect.height * dpr;
    canvasEl.style.width = rect.width + 'px';
    canvasEl.style.height = rect.height + 'px';
    const ctx = canvasEl.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const H = rect.height;
    ctx.clearRect(0, 0, W, H);

    const cellW = W / C;
    const cellH = H / R;
    const isRgb = channel === 'rgb';

    // Draw grid cells
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const v = grid[r][c];
        const t = maxVal > 0 ? v / maxVal : 0;
        if (isRgb) {
          // Blue heatmap: transparent→deep blue
          ctx.fillStyle = `rgba(88, 166, 255, ${t * 0.75})`;
        } else {
          // Orange heatmap: transparent→deep orange
          ctx.fillStyle = `rgba(255, 107, 53, ${t * 0.75})`;
        }
        ctx.fillRect(c * cellW, r * cellH, cellW, cellH);

        // Cell count label
        if (v > 0) {
          ctx.fillStyle = t > 0.5 ? '#fff' : 'rgba(255,255,255,0.7)';
          ctx.font = `bold ${Math.max(10, Math.min(cellW, cellH) * 0.35)}px "JetBrains Mono", monospace`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(v), c * cellW + cellW / 2, r * cellH + cellH / 2);
        }
      }
    }

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let r = 0; r <= R; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * cellH);
      ctx.lineTo(W, r * cellH);
      ctx.stroke();
    }
    for (let c = 0; c <= C; c++) {
      ctx.beginPath();
      ctx.moveTo(c * cellW, 0);
      ctx.lineTo(c * cellW, H);
      ctx.stroke();
    }

    // Draw individual points
    const dotR = Math.max(2, Math.min(cellW, cellH) * 0.08);
    ctx.fillStyle = isRgb ? '#58a6ff' : '#ff6b35';
    for (const [nx, ny] of normPoints) {
      ctx.beginPath();
      ctx.arc(nx * W, ny * H, dotR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, 0, W, H);
  }, [heatData]);

  // Redraw on data change
  useEffect(() => {
    if (!heatData) return;
    drawHeatmap(rgbCanvasRef.current, 'rgb');
    drawHeatmap(thermalCanvasRef.current, 'thermal');
  }, [heatData, drawHeatmap]);

  // Redraw on resize
  useEffect(() => {
    const handleResize = () => {
      if (!heatData) return;
      drawHeatmap(rgbCanvasRef.current, 'rgb');
      drawHeatmap(thermalCanvasRef.current, 'thermal');
    };
    window.addEventListener('resize', handleResize);
    return () => window.removeEventListener('resize', handleResize);
  }, [heatData, drawHeatmap]);

  const rgbTotal = heatData?.rgb?.total ?? 0;
  const thTotal = heatData?.thermal?.total ?? 0;
  const rgbMax = heatData?.rgb?.max ?? 0;
  const thMax = heatData?.thermal?.max ?? 0;

  // Compute coverage %: cells with at least 1 point
  const coveragePct = (channelData) => {
    if (!channelData) return 0;
    const { grid } = channelData;
    const total = grid.length * (grid[0]?.length || 0);
    const filled = grid.flat().filter(v => v > 0).length;
    return total > 0 ? Math.round(filled / total * 100) : 0;
  };

  return (
    <div className="heatmap-overlay">
      <div className="heatmap-toolbar">
        <span style={{ fontWeight: 600, fontSize: 13 }}>🗺 Point Distribution</span>
        <div className="divider" />
        <label>Rows</label>
        <input type="range" min="2" max="24" value={rows} onChange={e => onRowsChange(Number(e.target.value))} />
        <span className="range-val">{rows}</span>
        <label>Cols</label>
        <input type="range" min="2" max="24" value={cols} onChange={e => onColsChange(Number(e.target.value))} />
        <span className="range-val">{cols}</span>
        <div className="divider" />
        {loading && <span className="spinner" />}
        {heatData && !loading && (
          <>
            <span style={{ fontSize: 11, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>
              RGB: {rgbTotal}pts · {coveragePct(heatData.rgb)}% coverage
            </span>
            <span style={{ fontSize: 11, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>
              TH: {thTotal}pts · {coveragePct(heatData.thermal)}% coverage
            </span>
          </>
        )}
      </div>

      <div className="heatmap-grid-container">
        {[
          { key: 'rgb', label: 'RGB', ref: rgbCanvasRef, dot: 'var(--rgb-color)', total: rgbTotal, max: rgbMax },
          { key: 'thermal', label: 'Thermal', ref: thermalCanvasRef, dot: 'var(--thermal)', total: thTotal, max: thMax },
        ].map(({ key, label, ref, dot, total, max }) => (
          <div className="heatmap-cell" key={key}>
            <h4>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: dot, display: 'inline-block' }} />
              {label}
              <span style={{ fontWeight: 400, fontSize: 11, color: 'var(--text-dim)', fontFamily: 'var(--font-mono)' }}>
                {total} points · peak {max}/cell
              </span>
            </h4>
            <div className="heatmap-canvas-wrap">
              <canvas ref={ref} />
            </div>
            <div className="heatmap-legend">
              <span>0</span>
              <canvas
                className="heatmap-gradient"
                ref={el => {
                  if (!el) return;
                  const c = el.getContext('2d');
                  el.width = 100; el.height = 10;
                  const grad = c.createLinearGradient(0, 0, 100, 0);
                  if (key === 'rgb') {
                    grad.addColorStop(0, 'rgba(88,166,255,0)');
                    grad.addColorStop(1, 'rgba(88,166,255,0.85)');
                  } else {
                    grad.addColorStop(0, 'rgba(255,107,53,0)');
                    grad.addColorStop(1, 'rgba(255,107,53,0.85)');
                  }
                  c.fillStyle = grad;
                  c.fillRect(0, 0, 100, 10);
                }}
              />
              <span>{max}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Annotation Panel (single image canvas with zoom/pan) ───
function AnnotationPanel({ projectId, pair, channel, points, isActive, tool, onClick, onMovePoint, onDragEnd }) {
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const imgRef = useRef(null);
  const [imgLoaded, setImgLoaded] = useState(false);
  const [imgDims, setImgDims] = useState(null);
  const [transform, setTransform] = useState({ x: 0, y: 0, scale: 1 });
  const dragRef = useRef({ dragging: false, startX: 0, startY: 0, startTx: 0, startTy: 0 });
  const pointDragRef = useRef({ active: false, idx: -1 });
  const [hoveredPointIdx, setHoveredPointIdx] = useState(-1);

  const filename = channel === 'rgb' ? pair.rgb : pair.thermal;
  const imgUrl = `/api/projects/${projectId}/image/${channel}/${filename}`;

  // Load image
  useEffect(() => {
    setImgLoaded(false);
    const img = new Image();
    img.onload = () => {
      imgRef.current = img;
      setImgDims({ w: img.naturalWidth, h: img.naturalHeight });
      setImgLoaded(true);
    };
    img.src = imgUrl;
  }, [imgUrl]);

  // Fit image to container on load
  useEffect(() => {
    if (!imgLoaded || !containerRef.current || !imgDims) return;
    const rect = containerRef.current.getBoundingClientRect();
    const scaleX = rect.width / imgDims.w;
    const scaleY = rect.height / imgDims.h;
    const scale = Math.min(scaleX, scaleY) * 0.95;
    const x = (rect.width - imgDims.w * scale) / 2;
    const y = (rect.height - imgDims.h * scale) / 2;
    setTransform({ x, y, scale });
  }, [imgLoaded, imgDims]);

  // Draw
  useEffect(() => {
    if (!canvasRef.current || !containerRef.current) return;
    const canvas = canvasRef.current;
    const rect = containerRef.current.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!imgRef.current || !imgLoaded) return;

    const { x, y, scale } = transform;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.drawImage(imgRef.current, 0, 0);

    // Draw points
    const coordKey = channel;
    points.forEach((pt, idx) => {
      const coord = pt[coordKey];
      if (!coord) return;
      const [px, py] = coord;

      const r = Math.max(4, 6 / scale);
      const lineW = Math.max(1, 2 / scale);
      const fontSize = Math.max(10, 14 / scale);

      ctx.strokeStyle = channel === 'rgb' ? '#58a6ff' : '#ff6b35';
      ctx.fillStyle = channel === 'rgb' ? '#58a6ff' : '#ff6b35';
      ctx.lineWidth = lineW;

      // Crosshair
      ctx.beginPath();
      ctx.moveTo(px - r * 2, py);
      ctx.lineTo(px + r * 2, py);
      ctx.moveTo(px, py - r * 2);
      ctx.lineTo(px, py + r * 2);
      ctx.stroke();

      // Circle
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.stroke();

      // Highlight hovered / dragged point
      if (idx === hoveredPointIdx) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = lineW;
        ctx.setLineDash([Math.max(2, 4 / scale), Math.max(2, 4 / scale)]);
        ctx.beginPath();
        ctx.arc(px, py, r * 2.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = channel === 'rgb' ? '#58a6ff' : '#ff6b35';
      }

      // Label
      ctx.font = `bold ${fontSize}px "JetBrains Mono", monospace`;
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = Math.max(2, 3 / scale);
      ctx.strokeText(pt.label, px + r * 1.5, py - r);
      ctx.fillStyle = channel === 'rgb' ? '#58a6ff' : '#ff6b35';
      ctx.fillText(pt.label, px + r * 1.5, py - r);
    });

    ctx.restore();
  }, [transform, points, imgLoaded, channel, hoveredPointIdx]);

  // Reset hover state when tool changes
  useEffect(() => {
    if (canvasRef.current) canvasRef.current.style.cursor = '';
    setHoveredPointIdx(-1);
  }, [tool]);

  // Canvas click → image coordinates
  const handleClick = (e) => {
    if (dragRef.current.didDrag) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const imgX = (cx - transform.x) / transform.scale;
    const imgY = (cy - transform.y) / transform.scale;
    if (imgX >= 0 && imgY >= 0 && imgDims && imgX <= imgDims.w && imgY <= imgDims.h) {
      onClick(imgX, imgY);
    }
  };

  // Pan / point grab
  const handleMouseDown = (e) => {
    if (e.button === 0 && tool === 'grab') {
      e.preventDefault();
      const rect = canvasRef.current.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const imgX = (cx - transform.x) / transform.scale;
      const imgY = (cy - transform.y) / transform.scale;
      const hitRadius = 12 / transform.scale;
      let nearest = -1, nearestDist = Infinity;
      points.forEach((pt, idx) => {
        const coord = pt[channel];
        if (!coord) return;
        const dx = coord[0] - imgX, dy = coord[1] - imgY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < hitRadius && dist < nearestDist) { nearest = idx; nearestDist = dist; }
      });
      if (nearest >= 0) {
        pointDragRef.current = { active: true, idx: nearest };
        dragRef.current.didDrag = false;
        if (canvasRef.current) canvasRef.current.style.cursor = 'grabbing';
      } else {
        dragRef.current = { dragging: true, startX: e.clientX, startY: e.clientY, startTx: transform.x, startTy: transform.y, didDrag: false };
      }
      return;
    }
    if (e.button === 1 || e.button === 2 || e.shiftKey) {
      e.preventDefault();
      dragRef.current = { dragging: true, startX: e.clientX, startY: e.clientY, startTx: transform.x, startTy: transform.y, didDrag: false };
    }
  };

  const handleMouseMove = (e) => {
    const rect = canvasRef.current?.getBoundingClientRect();
    if (!rect) return;
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;

    if (pointDragRef.current.active) {
      const imgX = (cx - transform.x) / transform.scale;
      const imgY = (cy - transform.y) / transform.scale;
      dragRef.current.didDrag = true;
      onMovePoint(pointDragRef.current.idx, imgX, imgY);
      return;
    }

    if (dragRef.current.dragging) {
      const dx = e.clientX - dragRef.current.startX;
      const dy = e.clientY - dragRef.current.startY;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragRef.current.didDrag = true;
      setTransform(t => ({ ...t, x: dragRef.current.startTx + dx, y: dragRef.current.startTy + dy }));
      return;
    }

    if (tool === 'grab' && canvasRef.current) {
      const imgX = (cx - transform.x) / transform.scale;
      const imgY = (cy - transform.y) / transform.scale;
      const hitRadius = 12 / transform.scale;
      let nearest = -1, nearestDist = Infinity;
      points.forEach((pt, idx) => {
        const coord = pt[channel];
        if (!coord) return;
        const dx = coord[0] - imgX, dy = coord[1] - imgY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < hitRadius && dist < nearestDist) { nearest = idx; nearestDist = dist; }
      });
      setHoveredPointIdx(nearest);
      canvasRef.current.style.cursor = nearest >= 0 ? 'grab' : 'default';
    }
  };

  const handleMouseUp = () => {
    if (pointDragRef.current.active) {
      pointDragRef.current = { active: false, idx: -1 };
      onDragEnd?.();
      if (canvasRef.current) canvasRef.current.style.cursor = hoveredPointIdx >= 0 ? 'grab' : 'default';
    }
    dragRef.current.dragging = false;
    dragRef.current.didDrag = false;
  };

  // Zoom
  const handleWheel = (e) => {
    e.preventDefault();
    const rect = canvasRef.current.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    setTransform(t => {
      const newScale = Math.min(Math.max(t.scale * factor, 0.05), 50);
      return {
        scale: newScale,
        x: mx - (mx - t.x) * (newScale / t.scale),
        y: my - (my - t.y) * (newScale / t.scale),
      };
    });
  };

  return (
    <div className="anno-panel">
      <div className="anno-panel-header">
        <div className="channel-label">
          <span className="channel-dot" style={{ background: channel === 'rgb' ? 'var(--rgb-color)' : 'var(--thermal)' }} />
          {channel === 'rgb' ? 'RGB' : 'Thermal'}
          {isActive && <span style={{ color: 'var(--accent)', fontSize: 11 }}> ← click here</span>}
        </div>
        <span className="dims">{imgDims ? `${imgDims.w}×${imgDims.h}` : '...'} — {filename}</span>
      </div>
      <div
        className={`canvas-wrap ${isActive ? 'awaiting-click' : ''}`}
        ref={containerRef}
        onContextMenu={e => e.preventDefault()}
      >
        <canvas
          ref={canvasRef}
          onClick={handleClick}
          onMouseDown={handleMouseDown}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
          onWheel={handleWheel}
        />
      </div>
    </div>
  );
}

// ─── Results Tab ───
function ResultsTab({ project, onRefresh }) {
  const [calibrating, setCalibrating] = useState(false);
  const [result, setResult] = useState(null);

  useEffect(() => {
    api(`/api/projects/${project.id}/calibration-result`)
      .then(r => { if (r) setResult(r); })
      .catch(() => {});
  }, [project.id]);

  const pairs = project.pairs || [];
  const annotations = project.annotations || {};
  const totalPoints = Object.values(annotations).reduce(
    (sum, a) => sum + (a.points || []).filter(p => p.rgb && p.thermal).length, 0
  );
  const hasCalib = !!project.initial_calibration;

  const runCalibration = async () => {
    setCalibrating(true);
    setResult(null);
    try {
      const res = await api(`/api/projects/${project.id}/calibrate`, { method: 'POST' });
      setResult(res);
      toast('Calibration complete!', 'success');
    } catch (e) {
      toast(`Calibration failed: ${e.message}`, 'error');
    }
    setCalibrating(false);
  };

  const renderCalibTable = (calib, label) => {
    if (!calib) return null;
    const K = calib.mtx;
    const dist = calib.dist;
    return (
      <div style={{ marginBottom: 16 }}>
        <h4 style={{ fontSize: 13, marginBottom: 6 }}>{label}</h4>
        <table className="calib-table">
          <thead>
            <tr><th>fx</th><th>fy</th><th>cx</th><th>cy</th><th>k1</th><th>k2</th><th>p1</th><th>p2</th><th>k3</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>{K[0][0].toFixed(2)}</td>
              <td>{K[1][1].toFixed(2)}</td>
              <td>{K[0][2].toFixed(2)}</td>
              <td>{K[1][2].toFixed(2)}</td>
              {(dist || []).slice(0, 5).map((d, i) => <td key={i}>{d.toFixed(6)}</td>)}
            </tr>
          </tbody>
        </table>
      </div>
    );
  };

  return (
    <div className="content" style={{ overflow: 'auto' }}>
      <div className="results-grid">
        <div className="result-card">
          <h3>Run Calibration</h3>
          <div style={{ display: 'flex', gap: 16, marginBottom: 16, flexWrap: 'wrap' }}>
            <div className="result-metric">
              <span className="value">{totalPoints}</span>
              <span className="label">Point correspondences</span>
            </div>
            <div className="result-metric">
              <span className="value">{pairs.length}</span>
              <span className="label">Image pairs</span>
            </div>
            <div className="result-metric">
              <span className={`status-badge ${hasCalib ? 'ok' : 'warn'}`}>
                {hasCalib ? '✓ Loaded' : '⚠ Auto-estimate'}
              </span>
              <span className="label">Initial calibration</span>
            </div>
          </div>
          {!hasCalib && (
            <div style={{ marginBottom: 12, padding: '8px 12px', background: '#d2992215', border: '1px solid #d2992244', borderRadius: 'var(--radius)', fontSize: 12, color: 'var(--warning)' }}>
              No initial calibration loaded — intrinsics will be auto-estimated from image dimensions (assuming ~73° hFoV for RGB, ~45° for thermal). For best results, provide factory calibration values in the <strong>② Initial Calib</strong> tab.
            </div>
          )}
          <button
            className="btn btn-primary"
            disabled={calibrating || totalPoints < 4}
            onClick={runCalibration}
          >
            {calibrating ? <><span className="spinner" /> Optimizing...</> : '▶ Run Calibration'}
          </button>
          {totalPoints < 4 && (
            <span style={{ marginLeft: 12, fontSize: 12, color: 'var(--warning)' }}>
              Need ≥ 4 point correspondences
            </span>
          )}
        </div>

        {result && (
          <>
            <div className="result-card">
              <h3>Calibration Results</h3>
              {result.used_auto_estimate && (
                <div style={{ marginBottom: 12, padding: '8px 12px', background: '#d2992215', border: '1px solid #d2992244', borderRadius: 'var(--radius)', fontSize: 12, color: 'var(--warning)' }}>
                  ⚠ Used auto-estimated initial intrinsics. Results may improve if you provide factory calibration values.
                </div>
              )}
              <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', marginBottom: 16 }}>
                <div className="result-metric">
                  <span className="value">{result.homography_mse.toFixed(4)}</span>
                  <span className="label">Homography MSE</span>
                </div>
                <div className="result-metric">
                  <span className="value">{result.optimized_mse.toFixed(4)}</span>
                  <span className="label">Optimized MSE</span>
                </div>
                <div className="result-metric">
                  <span className="value">
                    {result.inlier_mask.filter(m => m === 1).length}/{result.num_points}
                  </span>
                  <span className="label">RANSAC inliers</span>
                </div>
              </div>

              {renderCalibTable(result.optimized_calibration?.Thermal, 'Optimized Thermal Intrinsics')}
              {renderCalibTable(result.optimized_calibration?.Wide, 'Wide / RGB Intrinsics (unchanged)')}

              <div style={{ display: 'flex', gap: 8, marginTop: 16, flexWrap: 'wrap' }}>
                <a className="btn btn-success" href={`/api/projects/${project.id}/download-calibration`} target="_blank">
                  ↓ Both (calibration.json)
                </a>
                <a className="btn" href={`/api/projects/${project.id}/download-calibration/thermal`} target="_blank" style={{ borderColor: 'var(--thermal)', color: 'var(--thermal)' }}>
                  ↓ Thermal only
                </a>
                <a className="btn" href={`/api/projects/${project.id}/download-calibration/rgb`} target="_blank" style={{ borderColor: 'var(--rgb-color)', color: 'var(--rgb-color)' }}>
                  ↓ RGB only
                </a>
                <a className="btn" href={`/api/projects/${project.id}/download-annotations`} target="_blank">
                  ↓ Annotations (pairs.xml)
                </a>
              </div>
            </div>

            {result.overlay_images && result.overlay_images.length > 0 && (
              <div className="result-card">
                <h3>Overlay Preview (Thermal + RGB edges)</h3>
                <div className="overlay-gallery">
                  {result.overlay_images.map((name, idx) => (
                    <img
                      key={idx}
                      src={`/api/projects/${project.id}/result-image/${name}`}
                      alt={`Overlay ${idx}`}
                    />
                  ))}
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ─── Mount ───
// ─── Single Camera Calibration ───

function SingleCamProjectView({ project, onRefresh }) {
  const [tab, setTab] = useState('upload');
  return (
    <>
      <div className="tab-bar">
        <button className={`tab ${tab === 'upload' ? 'active' : ''}`} onClick={() => setTab('upload')}>
          ① Upload
        </button>
        <button className={`tab ${tab === 'results' ? 'active' : ''}`} onClick={() => setTab('results')}>
          ② Results {project.calibration && <span className="status-badge ok" style={{ marginLeft: 6 }}>✓</span>}
        </button>
      </div>
      {tab === 'upload'  && <SingleUploadTab  project={project} onRefresh={onRefresh} />}
      {tab === 'results' && <SingleResultsTab project={project} onRefresh={onRefresh} />}
    </>
  );
}

function SingleUploadTab({ project, onRefresh }) {
  const [uploading, setUploading] = useState(false);
  const fileRef = useRef(null);

  const handleFiles = async (files) => {
    const accepted = [...files].filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
    if (!accepted.length) return;
    setUploading(true);
    try {
      const fd = new FormData();
      for (const f of accepted) fd.append('files', f);
      await api(`/api/single-calib/projects/${project.id}/upload`, { method: 'POST', body: fd });
      toast(`Uploaded ${accepted.length} file(s)`, 'success');
      await onRefresh();
    } catch (e) {
      toast(`Upload failed: ${e.message}`, 'error');
    }
    setUploading(false);
  };

  const deleteImage = async (name) => {
    try {
      await api(`/api/single-calib/projects/${project.id}/image/${encodeURIComponent(name)}`, { method: 'DELETE' });
      toast(`Deleted ${name}`, 'success');
      await onRefresh();
    } catch (e) {
      toast(`Delete failed: ${e.message}`, 'error');
    }
  };

  return (
    <div className="content" style={{ overflow: 'auto' }}>
      <div style={{ padding: 16 }}>
        <div
          className="calib-upload-zone"
          style={{ marginBottom: 16, padding: 32 }}
          onClick={() => fileRef.current?.click()}
          onDragOver={e => e.preventDefault()}
          onDrop={e => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
        >
          {uploading
            ? <><span className="spinner" /> Uploading...</>
            : '📂 Click or drop images or videos of any scene (multiple viewpoints required)'}
          <input ref={fileRef} type="file" multiple accept="image/*,video/*" style={{ display: 'none' }}
            onChange={e => handleFiles(e.target.files)} />
        </div>

        {project.images?.length > 0 ? (
          <>
            <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 10 }}>
              {project.images.length} image{project.images.length !== 1 ? 's' : ''} uploaded
            </div>
            <div className="sc-image-grid">
              {project.images.map(name => (
                <div key={name} className="sc-image-card" style={{ position: 'relative' }}>
                  <img src={`/api/single-calib/projects/${project.id}/image/${encodeURIComponent(name)}`} alt={name} />
                  <div className="sc-image-name">{name}</div>
                  <button
                    onClick={() => deleteImage(name)}
                    title="Delete image"
                    style={{
                      position: 'absolute', top: 4, right: 4,
                      background: 'var(--danger)', color: '#fff', border: 'none',
                      borderRadius: '50%', width: 20, height: 20, cursor: 'pointer',
                      fontSize: 12, lineHeight: '20px', padding: 0, textAlign: 'center'
                    }}
                  >×</button>
                </div>
              ))}
            </div>
          </>
        ) : (
          <div style={{ color: 'var(--text-muted)', fontSize: 13, textAlign: 'center', padding: 20 }}>
            Upload 10–20+ images or videos of a textured scene from different viewpoints. No calibration target needed — any scene with rich detail works.
          </div>
        )}
      </div>
    </div>
  );
}

function SingleResultsTab({ project, onRefresh }) {
  const [calibrating, setCalibrating] = useState(false);
  const [result, setResult] = useState(project.calibration || null);
  const [previewImg, setPreviewImg] = useState(null);
  const [showUndistorted, setShowUndistorted] = useState(true);
  const imageCount = project.images?.length || 0;

  useEffect(() => { setResult(project.calibration || null); }, [project.calibration]);
  useEffect(() => {
    if (project.images?.length > 0 && !previewImg) setPreviewImg(project.images[0]);
  }, [project.images]);

  const runCalibration = async () => {
    setCalibrating(true);
    try {
      const res = await api(`/api/single-calib/projects/${project.id}/calibrate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      setResult(res);
      toast('Calibration complete!', 'success');
      await onRefresh();
    } catch (e) {
      toast(`Calibration failed: ${e.message}`, 'error');
    }
    setCalibrating(false);
  };

  const K = result?.mtx;
  const dist = result?.dist || [];

  return (
    <div className="content" style={{ overflow: 'auto' }}>
      <div className="results-grid">
        <div className="result-card">
          <h3>Run SfM Calibration</h3>
          <div className="result-metric">
            <span className="value">{imageCount}</span>
            <span className="label">Images / frames</span>
          </div>
          {imageCount < 2 && (
            <div style={{ fontSize: 12, color: 'var(--warning)', margin: '8px 0' }}>
              ⚠ Upload at least 2 images with scene overlap.
            </div>
          )}
          <div style={{ fontSize: 12, color: 'var(--text-muted)', margin: '8px 0 12px' }}>
            Extracts SIFT features, matches image pairs, estimates focal length from fundamental matrices, then jointly optimises K + poses via bundle adjustment.
          </div>
          <button className="btn btn-primary" onClick={runCalibration} disabled={calibrating || imageCount < 2}>
            {calibrating ? <><span className="spinner" /> Reconstructing...</> : '▶ Run SfM Calibration'}
          </button>
        </div>

        {result && (
          <>
            <div className="result-card">
              <h3>Results</h3>
              <div className="result-metric">
                <span className="value" style={{ color: result.rms < 1 ? 'var(--success)' : result.rms < 2 ? 'var(--warning)' : 'var(--danger)' }}>
                  {result.rms.toFixed(4)}
                </span>
                <span className="label">RMS reprojection error (px)</span>
              </div>
              <div className="result-metric">
                <span className="value">{result.num_images}</span>
                <span className="label">Cameras registered</span>
              </div>
              <div className="result-metric">
                <span className="value">{result.num_pairs}</span>
                <span className="label">Matched pairs</span>
              </div>
              <div className="result-metric">
                <span className="value">{result.num_points}</span>
                <span className="label">3-D points</span>
              </div>
              <div className="result-metric">
                <span className="value">{result.initial_focal?.toFixed(0)}</span>
                <span className="label">Initial focal (px)</span>
              </div>
              <div className="result-metric">
                <span className="value">{result.image_size?.join('×')}</span>
                <span className="label">Image size (px)</span>
              </div>

              <h4 style={{ fontSize: 13, marginTop: 16, marginBottom: 6 }}>Camera Matrix</h4>
              {K && (
                <table className="calib-table">
                  <thead><tr><th>fx</th><th>fy</th><th>cx</th><th>cy</th></tr></thead>
                  <tbody><tr>
                    <td>{K[0][0].toFixed(2)}</td>
                    <td>{K[1][1].toFixed(2)}</td>
                    <td>{K[0][2].toFixed(2)}</td>
                    <td>{K[1][2].toFixed(2)}</td>
                  </tr></tbody>
                </table>
              )}

              <h4 style={{ fontSize: 13, marginTop: 12, marginBottom: 6 }}>Distortion Coefficients</h4>
              <table className="calib-table">
                <thead><tr><th>k1</th><th>k2</th><th>p1</th><th>p2</th><th>k3</th></tr></thead>
                <tbody><tr>
                  {dist.slice(0, 5).map((d, i) => <td key={i}>{d.toFixed(6)}</td>)}
                </tr></tbody>
              </table>

              <div style={{ marginTop: 16 }}>
                <a className="btn btn-success" href={`/api/single-calib/projects/${project.id}/download`} target="_blank">
                  ↓ Download calibration.json
                </a>
              </div>
            </div>

            <div className="result-card">
              <h3>Per-image reprojection error</h3>
              <table className="calib-table">
                <thead><tr><th>Image</th><th>RMS (px)</th></tr></thead>
                <tbody>
                  {(result.per_image_rms || []).map((row, i) => (
                    <tr key={i} style={{ cursor: 'pointer', background: previewImg === row.image ? 'var(--bg-hover)' : undefined }}
                        onClick={() => setPreviewImg(row.image)}>
                      <td>{row.image}</td>
                      <td style={{ color: row.rms > 1.5 ? 'var(--danger)' : row.rms > 1.0 ? 'var(--warning)' : 'var(--success)' }}>
                        {row.rms}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="result-card" style={{ gridColumn: '1 / -1' }}>
              <h3>Undistortion Preview</h3>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 12, flexWrap: 'wrap' }}>
                <select value={previewImg || ''} onChange={e => setPreviewImg(e.target.value)}
                        style={{ background: 'var(--bg-secondary)', color: 'var(--text)', border: '1px solid var(--border)', borderRadius: 4, padding: '4px 8px', fontSize: 13 }}>
                  {(project.images || []).map(img => <option key={img} value={img}>{img}</option>)}
                </select>
                <div style={{ display: 'flex', background: 'var(--bg-secondary)', border: '1px solid var(--border)', borderRadius: 4, overflow: 'hidden' }}>
                  <button onClick={() => setShowUndistorted(false)}
                          style={{ padding: '4px 12px', fontSize: 13, border: 'none', cursor: 'pointer', background: !showUndistorted ? 'var(--primary)' : 'transparent', color: !showUndistorted ? '#fff' : 'var(--text)' }}>
                    Original
                  </button>
                  <button onClick={() => setShowUndistorted(true)}
                          style={{ padding: '4px 12px', fontSize: 13, border: 'none', cursor: 'pointer', background: showUndistorted ? 'var(--primary)' : 'transparent', color: showUndistorted ? '#fff' : 'var(--text)' }}>
                    Undistorted
                  </button>
                </div>
              </div>
              {previewImg && (
                <div style={{ display: 'flex', gap: 12 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 6, textAlign: 'center' }}>Original</div>
                    <img src={`/api/single-calib/projects/${project.id}/image/${previewImg}`}
                         style={{ width: '100%', borderRadius: 6, border: '2px solid ' + (!showUndistorted ? 'var(--primary)' : 'transparent') }}
                         alt="original" />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 6, textAlign: 'center' }}>Undistorted</div>
                    <img src={`/api/single-calib/projects/${project.id}/undistort/${previewImg}`}
                         style={{ width: '100%', borderRadius: 6, border: '2px solid ' + (showUndistorted ? 'var(--primary)' : 'transparent') }}
                         alt="undistorted" />
                  </div>
                </div>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function ProjectItem({ project, isActive, badge, onSelect, onRename, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(project.name);
  const inputRef = useRef(null);

  const startEdit = (e) => {
    e.stopPropagation();
    setDraft(project.name);
    setEditing(true);
    setTimeout(() => { inputRef.current?.select(); }, 0);
  };

  const commit = (e) => {
    setEditing(false);
    if (draft.trim() && draft.trim() !== project.name) onRename(e, draft.trim());
  };

  const onKeyDown = (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.target.blur(); }
    if (e.key === 'Escape') { setDraft(project.name); setEditing(false); }
  };

  return (
    <div
      className={`project-item ${isActive ? 'active' : ''}`}
      onClick={editing ? undefined : onSelect}
    >
      {editing ? (
        <input
          ref={inputRef}
          value={draft}
          onChange={e => setDraft(e.target.value)}
          onBlur={commit}
          onKeyDown={onKeyDown}
          onClick={e => e.stopPropagation()}
          style={{
            flex: 1, background: 'var(--bg-secondary)', color: 'var(--text)',
            border: '1px solid var(--primary)', borderRadius: 3,
            padding: '1px 4px', fontSize: 13, minWidth: 0,
          }}
        />
      ) : (
        <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{project.name}</span>
      )}
      {!editing && <span className="project-pairs">{badge}</span>}
      <button className="edit-btn" onClick={startEdit} title="Rename">✎</button>
      <button className="delete-btn" onClick={onDelete}>✕</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
